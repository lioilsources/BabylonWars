<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2e3155">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <title>DoggioWars Web</title>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="touch-zone"></div>
    <pre id="stats"></pre>
    <div id="menu">
      <button id="b-settings" title="Esc">⚙</button>
      <button id="b-map" title="Z" data-i18n="menu.map">Mapa</button>
      <button id="b-mode" title="M" data-i18n="menu.mode">Režim</button>
      <button id="b-weapon" title="1 / 2 / kolečko" data-i18n="menu.weapon">Zbraň</button>
      <button id="b-respawn" title="R" data-i18n="menu.respawn">Domů</button>
      <button id="b-console" title="/">/</button>
    </div>
    <div id="aim" class="marker"></div>
    <div id="nose" class="marker"></div>
    <div id="start">
      <h1 data-i18n="start.title">DoggioWars</h1>
      <p class="go" id="start-go"></p>
      <p class="keys"><span data-i18n="help.keys"></span><br><span data-i18n="help.keys2"></span></p>
    </div>
    <div id="error"></div>
  </div>
  <script type="module" src="/src/game/main.ts"></script>
</body>
</html>
