<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#8cbff2">
  <title>DoggioWars Web</title>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="touch-zone"></div>
    <pre id="stats"></pre>
    <div id="flight"></div>
    <div id="labels"></div>
    <div id="menu">
      <button id="b-console" title="/">/</button>
      <button id="b-mode" title="M">režim</button>
      <button id="b-preset" title="C">řízení</button>
      <button id="b-tilt" title="T">horizont</button>
      <button id="b-view" title="V">pohled</button>
      <button id="b-quality" title="O">kvalita</button>
      <button id="b-respawn" title="R">respawn</button>
    </div>
    <div id="aim" class="marker"></div>
    <div id="nose" class="marker"></div>
    <div id="help">Klikni do hry · myš míří · W/S plyn · A/D náklon (ponorka úkrok) · Space/Shift nahoru/dolů · Q/E výkrut · F / pravé tl. boost<br>
      M ponorka/stíhačka · C řízení · T horizont · V pohled · O kvalita · R domů · / příkazy</div>
    <div id="error"></div>
  </div>
  <script type="module" src="/src/game/main.ts"></script>
</body>
</html>
