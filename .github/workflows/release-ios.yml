# Release iOS → TestFlight. Podle Distribution golden (podpis, profil, export),
# místo Flutteru web build + Capacitor sync.
name: Release iOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build & Release iOS
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Web build + Capacitor sync
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Set version from tag
        run: |
          # Tag je verze: v1.2.3 nebo v1.2.3-beta -> 1.2.3; ruční běh bez tagu nechá verzi z projektu.
          PBX=ios/App/App.xcodeproj/project.pbxproj
          TAG="${GITHUB_REF_NAME#v}"
          TAG="${TAG%%-*}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            sed -i '' -E "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = ${TAG};/" $PBX
          fi
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = ${{ github.run_number }};/" $PBX
          grep -E "MARKETING_VERSION|CURRENT_PROJECT_VERSION" $PBX

      - name: Import signing certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$CERTIFICATE_P12_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $RUNNER_TEMP/certificate.p12 -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode > $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          DECODED=$(security cms -D -i "$PP_PATH")
          UUID=$(echo "$DECODED" | plutil -extract UUID raw -)
          PROFILE_NAME=$(echo "$DECODED" | plutil -extract Name raw -)
          echo "Profile: $PROFILE_NAME ($UUID), expires $(echo "$DECODED" | plutil -extract ExpirationDate raw -)"
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
          echo "PROFILE_UUID=$UUID" >> $GITHUB_ENV

      - name: Inject profile UUID into project
        run: |
          # dva výrazy: quoted i unquoted placeholder (jeden výraz by pbxproj poškodil)
          sed -i '' \
            -e "s/\"CI_PROFILE_NAME\"/\"$PROFILE_UUID\"/g" \
            -e "s/CI_PROFILE_NAME/\"$PROFILE_UUID\"/g" \
            ios/App/App.xcodeproj/project.pbxproj
          grep PROVISIONING_PROFILE_SPECIFIER ios/App/App.xcodeproj/project.pbxproj

      - name: Archive with manual signing
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            DEVELOPMENT_TEAM=$TEAM_ID

      - name: Export IPA
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          /usr/libexec/PlistBuddy -c "Set :teamID $TEAM_ID" ios/App/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.ol1n.doggiowars $PROFILE_NAME" ios/App/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist ios/App/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/ipa

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          xcrun altool --upload-app \
            --type ios \
            --file "$(ls $RUNNER_TEMP/ipa/*.ipa)" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Upload IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/ipa/*.ipa
          name: DoggioWars ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8
